# SaaS Factory — run tooling inside containers (minimal host installs).
# Blueprint infra (Redis / Postgres) is merged from compose.generated.yaml (npm run app:scaffold).
#
# Configure + scaffold (Docker-first npm scripts):
#   npm run app:configure
#   npm run app:scaffold
#
# Node:
#   docker compose -f docker/compose.yaml run --rm node npm run check
#
# Infra from blueprint (profile infra):
#   docker compose -f docker/compose.yaml --profile infra up -d
#
# Toolchains (Go / .NET / Python):
#   docker compose -f docker/compose.yaml --profile toolchains run --rm go go version

include:
  - compose.generated.yaml

services:
  node:
    build:
      context: ..
      dockerfile: docker/node/Dockerfile
    working_dir: /workspace
    volumes:
      - ../:/workspace:cached
    ports:
      - "5173:5173"
      - "4000:4000"
    stdin_open: true
    tty: true
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      CHOKIDAR_USEPOLLING: "true"
      # BLUEPRINT_NODE_ENV_START
      REDIS_URL: redis://redis:6379
      # BLUEPRINT_NODE_ENV_END
    command: ["sleep", "infinity"]

  go:
    profiles: [toolchains]
    image: golang:1.23-bookworm
    working_dir: /workspace
    volumes:
      - ../:/workspace:cached

  dotnet:
    profiles: [toolchains]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    volumes:
      - ../:/workspace:cached

  python:
    profiles: [toolchains]
    image: python:3.12-bookworm
    working_dir: /workspace
    volumes:
      - ../:/workspace:cached
