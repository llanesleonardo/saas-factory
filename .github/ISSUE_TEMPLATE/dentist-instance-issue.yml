name: Dentist instance — issue
description: Bug, task, or question for the dentist vertical app (apps/dentist-instance).
title: "[dentist] "
labels:
  - "app:dentist-instance"
body:
  - type: markdown
    attributes:
      value: |
        This issue is **routed to the Dentist GitHub Project** when `PROJECT_URL_APP_DENTIST` and `ADD_TO_PROJECT_PAT` are configured — see **organizational_memory/GITHUB-PROJECTS-SETUP.md**.

  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Bug
        - Task
        - Question
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction / steps (optional)
    validations:
      required: false
