name: Mission control instance — issue
description: Bug, task, or question for the mission-control placeholder app (apps/mission-control-instance).
title: "[mission-control] "
labels:
  - "app:mission-control-instance"
body:
  - type: markdown
    attributes:
      value: |
        This issue is **routed to the Mission control GitHub Project** when `PROJECT_URL_APP_MISSION_CONTROL` and `ADD_TO_PROJECT_PAT` are configured — see **organizational_memory/GITHUB-PROJECTS-SETUP.md**.

  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Bug
        - Task
        - Question
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction / steps (optional)
    validations:
      required: false
