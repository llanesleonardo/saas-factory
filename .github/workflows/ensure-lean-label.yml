# GitHub does not auto-create labels from issue templates. Ensure "lean issue" exists once.
name: Ensure lean issue label

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/ISSUE_TEMPLATE/lean-waste.yml"
      - ".github/workflows/ensure-lean-label.yml"

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create label "lean issue" if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh label list --json name --jq '.[].name' | grep -Fxq 'lean issue'; then
            echo 'Label lean issue already exists.'
          else
            gh label create 'lean issue' --color FBCA04 --description 'Lean manufacturing / waste tracking (TIMWOOD)'
            echo 'Created label lean issue.'
          fi
