# Factory CI: typecheck, validators, orchestrator, line next (JSON) — no inter-job deps.
# Spec prompt generation is intentionally not run on every PR; run locally when needed:
#   npm run mfg -- spec generate <vertical>
name: Factory CI (parallel)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  factory-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate factory (queues, registries, fixtures, agent-output, QMS, self-heal)
        run: npm run mfg -- validate factory

      - name: Emit line next (JSON)
        run: npm run mfg -- line next -- --json | tee factory-next.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-evidence
          path: |
            factory-next.json

  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run mfg -- line orchestrate
