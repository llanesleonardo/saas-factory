# Parallel "agent gates" on GitHub: typecheck, orchestrator, wave plan — no inter-job deps.
# Spec prompt generation for other verticals is intentionally not run on every PR; run it manually via
# `.github/workflows/factory-distributed-dispatch.yml` when needed.
name: Factory CI (parallel)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run factory

  parallel-waves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Emit parallel wave plan (JSON for downstream / observability)
        run: npm run parallel-plan -- --json | tee parallel-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-plan
          path: parallel-plan.json
